<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InfoScreen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="hero" id="hero">
    <div class="hero-top">
      <div class="hero-main">
        <div class="loc" id="loc">Učitavanje lokacije…</div>
        <div class="now">
          <div class="icon" id="heroIcon">–</div>
          <div class="temp" id="heroTemp">–°</div>
          <div class="desc" id="heroDesc">Učitavanje…</div>
        </div>
        <div class="meta">
          <span>Oseća se kao <b id="heroFeels">–</b></span>
          <span>Vlažnost <b id="heroHum">–</b></span>
          <span>Vetar (brz./udar) <b id="heroWind">–</b></span>
          <span>Padavine <b id="heroPrecip">–</b></span>
        </div>
      </div>

      <div class="aqi-block" id="aqiBlock" style="display:none;">
        <div class="aqi-label">AQI</div>
        <div class="aqi-num" id="aqiNum">–</div>
        <div class="aqi-cat" id="aqiCat">–</div>
      </div>
    </div>
  </div>

  <div class="forecast-grid">
    <section class="col">
      <h2 class="colTitle">Sledećih 12h</h2>
      <div class="chart-card">
        <div class="chart-legend"><span><i style="background:var(--amber)"></i>Temperatura</span><span><i style="background:var(--rain)"></i>Padavine</span><span><i style="background:var(--wind)"></i>Vetar</span></div>
        <div id="hourlyChart"></div>
      </div>
      <button class="more-btn" id="hourlyBtn">Prikaži detaljniji prikaz</button>
      <div class="details" id="hourlyDetails"></div>
    </section>

    <section class="col">
      <h2 class="colTitle">Sledećih 7 dana</h2>
      <div class="chart-card">
        <div class="chart-legend">
          <span><i style="background:var(--amber)"></i>Maks.</span>
          <span><i style="background:var(--teal)"></i>Min.</span>
          <span><i style="background:var(--rain)"></i>Padavine</span>
          <span><i style="background:var(--wind)"></i>Vetar</span>
        </div>
        <div id="dailyChart"></div>
      </div>
      <button class="more-btn" id="dailyBtn">Prikaži detaljniji prikaz</button>
      <div class="details" id="dailyDetails"></div>
    </section>
  </div>

  <div class="status" id="status">
    Podaci: Open-Meteo
  </div>

  <div class="menu-photo-wrap" id="menuPhotoWrap" aria-live="polite"></div>
</div>

<script src="script.js"></script>
</body>
</html>
